
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aventura Mobile PWA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
  <h1>🗡️ Aventura Mobile</h1>
  <button onclick="startGame()">▶️ Jogar</button>
  <button id="installBtn" style="display:none;">⬇️ Instalar</button>
</div>

<canvas id="game" style="display:none;"></canvas>

<div id="controls" style="display:none;">
  <button onclick="move('left')">⬅️</button>
  <button onclick="move('up')">⬆️</button>
  <button onclick="move('down')">⬇️</button>
  <button onclick="move('right')">➡️</button>
</div>

<script src="game.js"></script>
</body>
</html>
